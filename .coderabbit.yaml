# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# The high-level summary in the pull request description is on again. It was turned off only because the
# commit-metadata guard scanned all PR text; the guard now reads only AI attribution lines (see AGENTS.md).
#
# The key and its meaning come from the vendor's documentation page "Summaries" under PR reviews
# (docs.coderabbit.ai/pr-reviews/summaries), read on 2026-10-11:
#   reviews.high_level_summary: false   "Disables automatic appending of the summary to the PR description."
reviews:
  high_level_summary: true
