# ============================================================================
# scan-config.yaml — azure-wordpress (Terraform/OpenTofu module library)
# Consumes the shared scan->fix platform agenticcodingops/auto-code-scanning: the scan and fix loop pin v3.1.5.
# Pure HCL: Terraform/IaC scanning only (Trivy-IaC + Checkov + tflint + fmt) + secrets.
# See docs at the platform repo + LOCAL-HOOKS-TOGGLE.md for the off-switch below.
# ============================================================================
schema_version: "1.0"

global:
  # OFF-SWITCH: set false to skip ALL local pre-commit/pre-push hooks (e.g. to avoid
  # blocking in-progress work) WITHOUT uninstalling lefthook; CI + the fix-loop are
  # unaffected. Default true; only an explicit false disables.
  local_hooks_enabled: true

# Not configured here:
# - severities, scanner arguments and hook stages: lefthook.yml and the vendored hooks
#   set the local ones, and terraform-scan.yml's inputs set CI's (CRITICAL,HIGH);
# - tool versions: CI uses the scanner versions pinned in the auto-code-scanning release
#   it calls, and local hooks run whatever is on PATH;
# - terraform validate: it needs per-module `init -backend=false`, so it runs only in
#   CI (validate.yml), keeping commits fast;
# - local tflint: provision SCAN_TFLINT_CONFIG and SCAN_TFLINT_PLUGIN_DIR outside this
#   checkout (CONTRIBUTING.md);
# - local Checkov policy: .scanning/configs/.checkov.yaml, which mirrors validate.yml.
languages:
  # --- Terraform / IaC (the only language here) -----------------------------
  terraform:
    enabled: true

ci:
  # Read only by the platform's app-code workflow when it detects languages from this
  # file; this repository does not call that workflow (its scan is terraform-scan.yml).
  sarif:
    category_prefix: "scan-"

suppressions:
  # Path of the suppression registry. This repository has none yet; expiry limits and
  # approval rules would live in the registry's own `settings` block.
  file: ".scan-suppressions.yaml"

# ----------------------------------------------------------------------------
# FIX LOOP (LAYER B) — opt-in (PR needs the `ai-autofix` label). The agent fixes
# IaC issues flagged by reviews, restricted to the module/example .tf via the
# allowlist; a separate job re-verifies (terraform fmt) and pushes via AUTOFIX_TOKEN.
# ----------------------------------------------------------------------------
fix_loop:
  enabled: true
  human_review_label: "needs-human-review"
  max_turns: 12
  max_iterations: 3

  # ALLOWLIST — only the Terraform modules/examples are auto-fixable.
  allowlist_paths:
    - "modules/"
    - "examples/"

  # GATED — never auto-fixed even inside an allowlisted dir.
  gated_paths:
    - "auth"
    - "payment"
    - "crypto"
    - "security"
    - "identity"
    - "secret"
    - "credential"
    - ".github/"
    - ".claude/"
    - "hooks"
    - "lefthook.yml"
    - "scan-and-fix.ps1"
    - "scripts/"
    - ".env"
    - "LICENSE"

  # SHA-pinned claude-code-action (>= v1.0.93, CVE-2025-66032). Schema-required mirror:
  # the reusable workflow's own `uses:` pin is what runs; nothing reads this value at run time.
  claude_code_action_ref: "anthropics/claude-code-action@d5726de019ec4498aa667642bc3a80fca83aa102"

  # Authoritative re-verify in JOB B (apply-and-push). Read from the BASE ref (a PR
  # can't change it), runs token-free. `terraform fmt -check` is fast (no init) and
  # catches the most common agent mistake (malformed HCL). terraform is preinstalled
  # on ubuntu-latest.
  build_verify_cmd: "terraform fmt -check -recursive"
