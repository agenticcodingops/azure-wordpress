# ============================================================================
# Terraform Security Scan (CALLER) — consumes the shared reusable IaC scanner from
# agenticcodingops/auto-code-scanning. Trivy-IaC + Checkov + tflint over the modules,
# uploading SARIF under distinct categories. Pinned to the immutable commit SHA.
# ============================================================================
name: Terraform Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning
  pull-requests: write # PR annotations

jobs:
  terraform-scan:
    # PIN to the IMMUTABLE commit SHA. Bump deliberately.
    uses: agenticcodingops/auto-code-scanning/.github/workflows/reusable-scan.yml@a83e29f2d948059d3d59f3498f302ff001c56b43 # v2.2.0
    with:
      terraform-directory: "."
      cloud-provider: "azure"
      severity: "CRITICAL,HIGH"
      scanning-repo-ref: "a83e29f2d948059d3d59f3498f302ff001c56b43" # v2.2.0
