# ============================================================================
# Terraform Security Scan (CALLER) — consumes the shared reusable IaC scanner from
# agenticcodingops/auto-code-scanning. Trivy-IaC + Checkov + tflint over the modules,
# uploading SARIF under distinct categories. Pinned to the immutable v2.0.6 commit SHA.
# ============================================================================
name: Terraform Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning
  pull-requests: write # PR annotations

jobs:
  terraform-scan:
    # PIN to the IMMUTABLE v2.0.6 commit SHA (== tag v2.0.6). Bump deliberately.
    uses: agenticcodingops/auto-code-scanning/.github/workflows/reusable-scan.yml@9816c62818079b8e4263d82b92aa95b0124b034b # v2.0.6
    with:
      terraform-directory: "."
      cloud-provider: "azure"
      severity: "CRITICAL,HIGH"
      scanning-repo-ref: "9816c62818079b8e4263d82b92aa95b0124b034b"
