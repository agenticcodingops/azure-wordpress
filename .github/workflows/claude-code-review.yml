name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip PRs a bot opened, such as dependency updates. The action refuses a non-human
    # actor, so without this every such PR shows a failed check.
    # A bot's push to a PR (a worker's fix commit) also starts this job, and the action then fails red on a
    # non-human actor. Skip those runs too (the sender check); a human push still runs it.
    if: github.event.pull_request.user.type != 'Bot' && github.event.sender.type != 'Bot'
    # One run per PR at a time, so a push during a review cannot start a second review before
    # the first has posted. The later run waits, then reviews the live head unless a summary
    # already names it (`Reviewed head: <sha>`; see "Find the head to review", #188). A push
    # during a review does not disturb it: the review reads a diff and a checkout pinned to its
    # commit, and the push's own run reviews the new head.
    # Not cancel-in-progress: cancelling could cut a review off part-way through posting.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review: a summary comment or inline comments
      issues: read
      id-token: write

    steps:
      # Each head commit gets one review (#188). Left to itself, the plugin stops once Claude has
      # commented on the PR at all, so only a PR's first head was ever reviewed. This step decides
      # instead, outside the model, and pins the whole review to one commit:
      # - It reads the live head, not the event's SHA, so a run queued behind a review, re-run, or
      #   preceded by a bot push that starts no run of its own reviews the newest commit.
      # - It looks for a summary by the review app whose first line is `Reviewed head: <that SHA>`.
      #   The author must be the app (type Bot, login claude[bot]), so a user's comment, or a user
      #   named claude, cannot match. A head with a review skips the review step, which is what
      #   makes a re-run on the same commit post nothing.
      # - It saves that commit's diff against the base (the compare API's base...head, which is
      #   what the PR shows) to review.diff. `gh pr diff` always shows the live head, so a push
      #   during the review would change what the agents read under them; the prompt reads this
      #   file instead, and the checkout below is the same commit.
      # Both SHAs are checked to be 40 hex characters before anything uses them. A failed read
      # fails the job.
      - name: Find the head to review
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shas=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + " " + .base.sha')
          SHA=${shas%% *}
          BASE=${shas#* }
          for value in "$SHA" "$BASE"; do
            if ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then echo "unexpected SHA: $value" >&2; exit 1; fi
          done
          export SHA
          found=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.type == "Bot" and .user.login == "claude[bot]") | select((.body | split("\n")[0] | rtrimstr("\r")) == "Reviewed head: " + env.SHA) | .id')
          if [ -n "$found" ]; then reviewed=true; else reviewed=false; fi
          gh api -H "Accept: application/vnd.github.diff" "repos/$REPO/compare/$BASE...$SHA" > "$RUNNER_TEMP/review.diff"
          echo "Head $SHA; already reviewed: $reviewed"
          { echo "sha=$SHA"; echo "reviewed=$reviewed"; } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under review (see the step above), not the event's merge commit.
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 1
          # The review reads files in this checkout, and the job token can write to PRs, so do
          # not persist it. This checkout version would keep it in a file under $RUNNER_TEMP
          # that the checkout's git config includes. The action sets up its own git auth.
          persist-credentials: false

      # The summary's body file has a fixed path (see claude_args). Remove anything the PR put
      # there, such as a symlink to .git/config, so the review always writes the file itself.
      - name: Clear the review summary path
        run: rm -rf -- "$GITHUB_WORKSPACE/.review-summary.md"

      # The plugin's frontmatter grants `Bash(gh pr comment:*)`, with any arguments, and the CLI
      # honours that grant in a non-interactive run: measured on 2.1.281, 2.1.302, 2.1.310, 2.1.314,
      # 2.1.316 and 2.1.325, with this job's --allowedTools and --disallowedTools in force, and a control
      # command without the grant was denied each time. So the exact-PR, exact-file rules in
      # claude_args do not bind that command: injected PR text could post on another PR, or post
      # `--body-file .git/config`. A deny rule cannot narrow a grant, so this hook does. It runs
      # before every tool call (matcher `*`): the shell tools other than Bash, such as Monitor,
      # reach a hook under a name that depends on the CLI version (measured: "Monitor" on 2.1.302,
      # "Bash" on 2.1.316; "Monitor" on 2.1.325 in a local run), and a tool added later would not be on any list. It is an allow-list,
      # not a keyword match, so no spelling of a command and no unlisted tool can get around it.
      # A shell command (Bash, Monitor or PowerShell) passes only if it is byte-for-byte one of
      # the three `gh pr comment` forms claude_args names, or a single `gh pr view|diff|list`,
      # `gh issue view|list` or `gh search <kind>` call whose words contain nothing the shell
      # would expand or split, and no --jq, --template, -q or -t. A file write passes only for the
      # summary file. Reading and listing the checkout, sub-agents, task tracking, the plugin's own
      # review command (the Skill tool, by exact name: 2.1.281 needs it, 2.1.316 does not) and the
      # inline-comment tool pass; every other tool is blocked, Grep and Glob included (#188): the
      # guard does not check the paths they search, so only a deny rule would stand between them
      # and the token in .git/config, and the guard makes no exemption. Exit 2 blocks, and stderr tells the
      # model why. The hook command adds `|| exit 2`, so a crash or a missing node blocks every
      # call. A hook that times out does not block, so a watchdog armed on the script's first line
      # blocks at 10 seconds, well inside the hook's 30-second timeout. The write rule matters
      # because the guard script and the settings that install it are files: with an unrestricted
      # Write the review could replace them. The hook is no use if a pull request can switch it
      # off. The checkout is the PR's head, and a `.claude/settings.json` in it with
      # `disableAllHooks` stopped a loaded hook (measured on 2.1.316 and 2.1.325), so claude_args passes
      # `--setting-sources user`, which keeps settings from the checkout out. The hook itself is
      # installed in the user settings, by the `settings` input.
      - name: Write the review comment guard
        run: |
          cat > "$RUNNER_TEMP/review-comment-guard.js" <<'GUARD'
          if (require.main === module) setTimeout(() => finish(2, "the guard timed out."), 10000);

          const path = require("path");

          // A word the shell passes through as written: no quote, backslash, #, $, backtick, ; & | < > ( )
          // { } * ? [ ] ~ ! or space in it. A # would start a shell comment and hide the quote that follows.
          const WORD = /[A-Za-z0-9_.\/:=,@%+-]+/;
          // A whole quoted word. Single quotes hold anything but a quote. Double quotes hold nothing the
          // shell would expand or escape. Nothing here can span a line, because decide() rejects them first.
          // \x5c is the backslash, written as an escape so no layer between an editor and this file can halve it.
          const QUOTED = /(?:'[^']*'|"[^"$`\x5c!]*")/;
          const ARG = WORD.source + "|" + QUOTED.source;
          const READ = new RegExp("^gh (?:pr (?:diff|view|list)|issue (?:view|list)|search [a-z]+)(?: (?:" + ARG + "))*$");
          const WORDS = new RegExp("(?<= )(?:" + ARG + ")(?= |$)", "g");
          // gh's --jq and --template can read environment variables, and -q and -t are their short forms.
          const FILTER = /^(?:--(?:jq|template)(?:=|$)|-(?!-)[A-Za-z]*[qt])/;
          const FILE_TOOLS = ["Write", "Edit", "MultiEdit", "NotebookEdit"];
          // Tools that run a shell command. The name a hook is given for them depends on the CLI version: a
          // Monitor call reaches a hook as "Bash" on 2.1.316 and as "Monitor" on 2.1.302, so all are listed.
          const SHELL_TOOLS = ["Bash", "Monitor", "PowerShell"];
          // Tools that neither run a command nor write a file, and that the review needs: reading and
          // listing the checkout, launching sub-agents, tracking tasks, and loading tool schemas.
          // Grep and Glob are not here: the guard does not check the paths they search, so they are blocked (#188).
          // Everything not named in this file is blocked, so a tool added to the CLI later fails closed.
          const NO_IO = ["Read", "LS", "Agent", "Task", "TaskCreate", "TaskGet", "TaskList", "TaskUpdate",
            "TaskOutput", "TaskStop", "BashOutput", "KillShell", "TodoWrite", "ToolSearch"];
          // Posts one inline comment. The action fixes the repository and pull request, and the body is text.
          const INLINE = "mcp__github_inline_comment__create_inline_comment";
          // The review starts from the plugin's slash command. The CLI expands it up front on 2.1.316, but on 2.1.281
          // the model runs it through the Skill tool, and blocking that makes the model improvise a review without the
          // plugin's steps. A skill's body can carry its own allowed-tools, so only this one command is allowed, by name.
          const PLUGIN_COMMANDS = ["code-review:code-review", "code-review"];

          // Returns null to let the call go on to the normal permission check, or the reason to block it.
          function decide(tool, input, ctx) {
            const file = ctx.ws + "/.review-summary.md";
            if (FILE_TOOLS.includes(tool)) {
              // Every path field that is present must be the summary file, and there must be at least one.
              const targets = [input.file_path, input.notebook_path].filter((p) => p !== undefined);
              const ok = targets.length > 0 && targets.every((p) => typeof p === "string" && path.resolve(p) === path.resolve(file));
              return ok ? null : "the only file the review may write is " + file + ".";
            }
            if (tool === "Skill") {
              return PLUGIN_COMMANDS.includes(input.skill) ? null : "the review may not run the " + String(input.skill) + " skill.";
            }
            if (NO_IO.includes(tool) || tool === INLINE) return null;
            if (!SHELL_TOOLS.includes(tool)) return "the review may not use the " + tool + " tool.";

            const command = input.command;
            if (typeof command !== "string") return "a " + tool + " call without a command.";
            const comments = [
              "gh pr comment " + ctx.pr + " --repo " + ctx.repo + " --body-file " + file,
              "gh pr comment " + ctx.pr + " --body-file " + file,
              "gh pr comment https://github.com/" + ctx.repo + "/pull/" + ctx.pr + " --body-file " + file,
            ];
            if (comments.includes(command)) return null;
            // One line, and no control character, so a quoted string cannot hide a second command.
            if (!/[\x00-\x1f\x7f]/.test(command) && READ.test(command)) {
              for (const word of command.match(WORDS) || []) {
                if (FILTER.test(word.replace(/^(['"])(.*)\1$/, "$2"))) {
                  return "gh read calls may not use --jq, --template, -q or -t.";
                }
              }
              return null;
            }
            return "the only shell commands allowed are single gh calls with plain arguments: `gh pr view|diff|list`, " +
              "`gh issue view|list` and `gh search <kind>` (quote a search phrase as a whole word, with no $, backtick, " +
              "backslash or !; no #, pipes, redirects, heredocs, substitutions or line breaks), and the summary comment, " +
              "exactly `" + comments[0] + "`.";
          }

          function finish(code, why) {
            if (why) process.stderr.write("Blocked: " + why + "\n");
            process.exit(code);
          }

          if (require.main === module) {
            const [pr, repo, ws] = process.argv.slice(2);
            if (!/^[0-9]+$/.test(pr || "") || !/^[\w.-]+\/[\w.-]+$/.test(repo || "") || !ws) {
              finish(2, "the guard was started without its arguments.");
            }
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              let event;
              try {
                event = JSON.parse(raw);
              } catch (e) {
                finish(2, "the hook input could not be read.");
              }
              const why = decide(event.tool_name, event.tool_input || {}, { pr, repo, ws });
              if (why) finish(2, why);
              finish(0);
            });
          } else {
            module.exports = { decide };
          }
          GUARD
          node --check "$RUNNER_TEMP/review-comment-guard.js"

      # The review plugin, pinned to a commit, so the guard and the POSTING RULES below always
      # meet the command they were measured against. The claude-code marketplace resolves
      # `code-review` from anthropics/claude-plugins-official at `main`, which changed the plugin
      # on 2026-10-26 with no action bump. The action accepts a marketplace URL only without a
      # ref, but it takes a local path. That repository's own marketplace name is reserved: CLI
      # 2.1.325 refuses `claude-plugins-official` from any source but its GitHub repository
      # (measured 2026-11-21). So this step fetches the pinned commit and wraps the plugin in a
      # one-plugin marketplace of its own name. The plugin keeps its name, so the command stays
      # `/code-review:code-review`, the name the guard allows. A fetch of a full SHA is checked
      # by git against that SHA, and the step fails if HEAD is anything else. The review cannot
      # edit these files: Edit under $RUNNER_TEMP is denied, and the guard allows no other write.
      # Re-measure before moving the pin: read the new command file against the POSTING RULES.
      - name: Fetch the pinned review plugin
        env:
          # anthropics/claude-plugins-official 9780cf4, "code-review: add version 1.0.1" (2026-10-26),
          # the commit that last changed plugins/code-review.
          PLUGIN_COMMIT: 9780cf407f5593727b668bae95a0c4ae2e0de1ae
        run: |
          market="$RUNNER_TEMP/review-plugin"
          git init --quiet "$market/source"
          git -C "$market/source" fetch --quiet --depth 1 https://github.com/anthropics/claude-plugins-official.git "$PLUGIN_COMMIT"
          git -C "$market/source" -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$market/source" rev-parse HEAD)" = "$PLUGIN_COMMIT"
          test -f "$market/source/plugins/code-review/commands/code-review.md"
          mkdir -p "$market/.claude-plugin"
          cat > "$market/.claude-plugin/marketplace.json" <<'MARKET'
          {
            "name": "review-plugin-pinned",
            "owner": { "name": "review workflow" },
            "plugins": [{ "name": "code-review", "source": "./source/plugins/code-review" }]
          }
          MARKET

      - name: Run Claude Code Review
        id: claude-review
        # Only a head with no review yet (see the step above). An unset output skips it too, but
        # then that step has failed and the job is already red.
        if: steps.head.outputs.reviewed == 'false'
        # Re-measure before bumping this pin, and before loosening the guard step above: the
        # plugin's `gh pr comment` grant is honoured on every CLI version measured, so the
        # PR boundary rests on that guard, not on --allowedTools.
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review's sub-agents must run in the foreground. On this action and CLI
          # (2.1.281) the plugin's sub-agents can start in the background, either with no
          # `run_in_background` argument or by asking for it. The main agent then ends its
          # turn to wait for them, which ends the run: no review, nothing posted, and the
          # check still green. It comes and goes: measured on the same pinned action, four
          # of six runs failed this way, and the two that posted ran every sub-agent in the
          # foreground. This variable turns off background tasks for the whole run,
          # "including the `run_in_background` parameter on Bash and subagent tools,
          # auto-backgrounding" (https://code.claude.com/docs/en/env-vars).
          # It goes through `settings`, not the step's `env:`. At the pinned commit the
          # action's run step lists the variables it passes, and its own env block shadows
          # the caller's (action.yml, "this step's env: block shadows ..."). Its
          # docs/configuration.md, "Custom Environment Variables", names `settings` `env`.
          # The action merges this into ~/.claude/settings.json before it installs the
          # plugin. The POSTING RULES ask for the foreground too, as a second layer.
          # The same input carries the comment guard written above, as a PreToolUse hook on every tool.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"
              },
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "*",
                    "hooks": [
                      {
                        "type": "command",
                        "timeout": 30,
                        "command": "node '${{ runner.temp }}/review-comment-guard.js' ${{ github.event.pull_request.number }} ${{ github.repository }} '${{ github.workspace }}' || exit 2"
                      }
                    ]
                  }
                ]
              }
            }
          # The action's own token is in GH_TOKEN while the review runs, so text in a PR could
          # make the review disclose it (see claude_args). The action asks for contents, pull_requests
          # and issues, all write, and merges these lines over those defaults (src/github/token.ts),
          # so a scope left out here stays write; the job's own `issues: read` does not bind this
          # token. The review never pushes and never writes an issue: it posts inline comments through
          # the pull request review API and the summary with `gh pr comment`. So contents and issues
          # are read, and a leaked token can neither push code nor edit issues (#188).
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
          # The pinned plugin the step above fetched (see there).
          plugin_marketplaces: ${{ runner.temp }}/review-plugin
          plugins: 'code-review@review-plugin-pinned'
          # Without --comment the plugin reviews and then posts nothing, by design.
          # The POSTING RULES reach the plugin as arguments. Without them the model reaches for
          # `gh api` and heredoc bodies, which the allow-list denies, so nothing gets posted.
          # Measured locally on 2026-09-24 with the same CLI version: 8 denials without the
          # rules, and with them the summary goes out as an allowed `--body-file` command.
          # A redirect such as `gh pr diff <N> > file` is denied too, because its target is
          # checked as a file write: on one review elsewhere it was 22 of 23 denials. The diff is
          # now saved before the review (review.diff, read with the Read tool, which the one
          # `Read(...)` rule in claude_args allows outside the checkout), so no agent needs to
          # redirect anything.
          # Folded (>-) into one line, which is how the plugin receives arguments.
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            REVIEWED HEAD (follow exactly):
            this run reviews commit ${{ steps.head.outputs.sha }}; call it the reviewed SHA.
            A workflow step has already checked that no earlier review names this commit, so drop step 1's condition
            "Claude has already commented on this PR", and tell the step 1 agent so; keep step 1's other conditions.
            The diff of the reviewed commit is in ${{ runner.temp }}/review.diff, and the checkout is that commit.
            Read the diff from that file with the Read tool, never with gh pr diff, which shows a later push if one lands,
            and tell every agent you launch to do the same.
            Pass commit_id set to the reviewed SHA on every inline comment, and use the reviewed SHA in every code link.
            Always post exactly one summary comment, after any inline comments, whether or not issues were found.
            Its first line is exactly `Reviewed head: ${{ steps.head.outputs.sha }}`, followed by the plugin's summary;
            when issues were posted inline, list each in one line in place of "No issues found".
            POSTING RULES (follow exactly):
            the head commit SHA is the reviewed SHA above; never read it with gh api.
            Read saved tool output with the Read tool, never with shell commands.
            Tell every agent you launch to read saved tool output with the Read tool.
            Post inline comments only with the mcp__github_inline_comment__create_inline_comment tool, never with gh api.
            To post the summary comment, first write the body to ${{ github.workspace }}/.review-summary.md with the Write tool,
            then run exactly `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file ${{ github.workspace }}/.review-summary.md`,
            with no other flags and no other file;
            never use redirects, heredocs, pipes or command substitution in gh commands,
            and never use --jq, -q, --template or -t with gh.
            Run every sub-agent in the foreground: if the Agent tool takes run_in_background, pass false, and never end your turn while a sub-agent is still running.
          # The plugin's own allowed-tools list plus an Edit rule for the summary file only (an
          # Edit rule covers the Write tool; a Write(path) rule is never matched), so its gh and
          # inline-comment calls are not denied. The denies keep the file tools off the guard
          # script, the settings that install it, and .git. `gh pr comment` is named here by this PR (by
          # number or URL) and one body file, with exact rules and no wildcard. These rules only
          # approve those forms; the plugin's own grant approves every other `gh pr comment`, so
          # the guard step above is what stops one. The reasoning for the exact rules still holds
          # for the guard, which allows the same three forms. The review action
          # puts its own token in this checkout's .git/config and in GH_TOKEN, and only inline
          # comments go through its token redaction, so a prefix rule would let injected PR text
          # post `--body-file .git/config` or `--body-file /proc/self/environ`. The Read deny keeps
          # the Read tool out of .git. Grep and Glob are denied outright, as a second layer to
          # the guard, which blocks them. A trailing wildcard would not bind the file: gh takes the
          # last --body-file it is given. gh's --jq filter can read environment variables, so
          # the gh read commands may not use --jq or --template. This narrows exfiltration but
          # does not stop it: deny rules match the command text, so a crafted command can slip
          # past them, and read-only shell commands can still print the token. That token stays
          # live until the job ends, which is why it is asked for with contents: read.
          # From v1.0.276 the action starts sessions in auto mode, where a classifier approves
          # calls no allow rule covers. `--permission-mode default` keeps the mode the guard and
          # these rules were measured in: an unlisted call is denied, not reviewed. The guard
          # hook runs before any permission decision either way.
          claude_args: |
            --allowedTools "Read(/${{ runner.temp }}/review.diff),Edit(/${{ github.workspace }}/.review-summary.md),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr comment ${{ github.event.pull_request.number }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --disallowedTools "Grep,Glob,Read(./.git/**),Edit(/${{ runner.temp }}/**),Edit(~/.claude/**),Edit(/${{ github.workspace }}/.git/**),Bash(gh * --jq*),Bash(gh * -q*),Bash(gh * --template*),Bash(gh * -t*)"
            --setting-sources user
            --permission-mode default
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

