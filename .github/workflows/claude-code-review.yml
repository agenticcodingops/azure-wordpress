name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip PRs a bot opened, such as dependency updates. The action refuses a non-human
    # actor, so without this every such PR shows a failed check.
    # A bot's push to a PR (a worker's fix commit) also starts this job, and the action then fails red on a
    # non-human actor. Skip those runs too (the sender check); a human push still runs it.
    if: github.event.pull_request.user.type != 'Bot' && github.event.sender.type != 'Bot'
    # One run per PR at a time, so a push during a review cannot start a second review before
    # the first has posted. The later run waits, then the plugin sees the review and stops.
    # Not cancel-in-progress: cancelling could cut a review off part-way through posting.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review: a summary comment or inline comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The review reads files in this checkout, and the job token can write to PRs, so do
          # not persist it. This checkout version would keep it in a file under $RUNNER_TEMP
          # that the checkout's git config includes. The action sets up its own git auth.
          persist-credentials: false

      # The summary's body file has a fixed path (see claude_args). Remove anything the PR put
      # there, such as a symlink to .git/config, so the review always writes the file itself.
      - name: Clear the review summary path
        run: rm -rf -- "$GITHUB_WORKSPACE/.review-summary.md"

      # The plugin's frontmatter grants `Bash(gh pr comment:*)`, with any arguments, and the CLI
      # honours that grant in a non-interactive run: measured on 2.1.281, 2.1.302, 2.1.310, 2.1.314
      # and 2.1.316, with this job's --allowedTools and --disallowedTools in force, and a control
      # command without the grant was denied each time. So the exact-PR, exact-file rules in
      # claude_args do not bind that command: injected PR text could post on another PR, or post
      # `--body-file .git/config`. A deny rule cannot narrow a grant, so this hook does. It runs
      # before every Bash and file-write call (the hook is in `settings` below) and is an
      # allow-list, not a keyword match, so no spelling of a command can get around it. A shell
      # command passes only if it is byte-for-byte one of the three `gh pr comment` forms
      # claude_args names, or a single `gh pr view|diff|list`, `gh issue view|list` or
      # `gh search <kind>` call whose words contain nothing the shell would expand or split,
      # and no --jq, --template, -q or -t. A file write passes only for the summary file.
      # Exit 2 blocks, and stderr tells the model why. The hook command adds `|| exit 2`, so a
      # crash or a missing node blocks every call. A hook that times out does not block, so a
      # watchdog armed on the script's first line blocks at 10 seconds, well inside the hook's
      # 30-second timeout. The write rule matters because the guard script and the settings that
      # install it are files: with an unrestricted Write the review could replace them.
      - name: Write the review comment guard
        run: |
          cat > "$RUNNER_TEMP/review-comment-guard.js" <<'GUARD'
          if (require.main === module) setTimeout(() => finish(2, "the guard timed out."), 10000);

          const path = require("path");

          // A word the shell passes through as written: no quote, backslash, #, $, backtick, ; & | < > ( )
          // { } * ? [ ] ~ ! or space in it. A # would start a shell comment and hide the quote that follows.
          const WORD = /[A-Za-z0-9_.\/:=,@%+-]+/;
          // A whole quoted word. Single quotes hold anything but a quote. Double quotes hold nothing the
          // shell would expand or escape. Nothing here can span a line, because decide() rejects them first.
          // \x5c is the backslash, written as an escape so no layer between an editor and this file can halve it.
          const QUOTED = /(?:'[^']*'|"[^"$`\x5c!]*")/;
          const ARG = WORD.source + "|" + QUOTED.source;
          const READ = new RegExp("^gh (?:pr (?:diff|view|list)|issue (?:view|list)|search [a-z]+)(?: (?:" + ARG + "))*$");
          const WORDS = new RegExp("(?<= )(?:" + ARG + ")(?= |$)", "g");
          // gh's --jq and --template can read environment variables, and -q and -t are their short forms.
          const FILTER = /^(?:--(?:jq|template)(?:=|$)|-(?!-)[A-Za-z]*[qt])/;
          const FILE_TOOLS = ["Write", "Edit", "MultiEdit", "NotebookEdit"];

          // Returns null to let the call go on to the normal permission check, or the reason to block it.
          function decide(tool, input, ctx) {
            const file = ctx.ws + "/.review-summary.md";
            if (FILE_TOOLS.includes(tool)) {
              // Every path field that is present must be the summary file, and there must be at least one.
              const targets = [input.file_path, input.notebook_path].filter((p) => p !== undefined);
              const ok = targets.length > 0 && targets.every((p) => typeof p === "string" && path.resolve(p) === path.resolve(file));
              return ok ? null : "the only file the review may write is " + file + ".";
            }
            if (tool !== "Bash") return null;

            const command = input.command;
            if (typeof command !== "string") return "a Bash call without a command.";
            const comments = [
              "gh pr comment " + ctx.pr + " --repo " + ctx.repo + " --body-file " + file,
              "gh pr comment " + ctx.pr + " --body-file " + file,
              "gh pr comment https://github.com/" + ctx.repo + "/pull/" + ctx.pr + " --body-file " + file,
            ];
            if (comments.includes(command)) return null;
            // One line, and no control character, so a quoted string cannot hide a second command.
            if (!/[\x00-\x1f\x7f]/.test(command) && READ.test(command)) {
              for (const word of command.match(WORDS) || []) {
                if (FILTER.test(word.replace(/^(['"])(.*)\1$/, "$2"))) {
                  return "gh read calls may not use --jq, --template, -q or -t.";
                }
              }
              return null;
            }
            return "the only shell commands allowed are single gh calls with plain arguments: `gh pr view|diff|list`, " +
              "`gh issue view|list` and `gh search <kind>` (quote a search phrase as a whole word, with no $, backtick, " +
              "backslash or !; no #, pipes, redirects, heredocs, substitutions or line breaks), and the summary comment, " +
              "exactly `" + comments[0] + "`.";
          }

          function finish(code, why) {
            if (why) process.stderr.write("Blocked: " + why + "\n");
            process.exit(code);
          }

          if (require.main === module) {
            const [pr, repo, ws] = process.argv.slice(2);
            if (!/^[0-9]+$/.test(pr || "") || !/^[\w.-]+\/[\w.-]+$/.test(repo || "") || !ws) {
              finish(2, "the guard was started without its arguments.");
            }
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              let event;
              try {
                event = JSON.parse(raw);
              } catch (e) {
                finish(2, "the hook input could not be read.");
              }
              const why = decide(event.tool_name, event.tool_input || {}, { pr, repo, ws });
              if (why) finish(2, why);
              finish(0);
            });
          } else {
            module.exports = { decide };
          }
          GUARD
          node --check "$RUNNER_TEMP/review-comment-guard.js"

      - name: Run Claude Code Review
        id: claude-review
        # Re-measure before bumping this pin, and before loosening the guard step above: the
        # plugin's `gh pr comment` grant is honoured on every CLI version measured, so the
        # PR boundary rests on that guard, not on --allowedTools.
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review's sub-agents must run in the foreground. On this action and CLI
          # (2.1.281) the plugin's sub-agents can start in the background, either with no
          # `run_in_background` argument or by asking for it. The main agent then ends its
          # turn to wait for them, which ends the run: no review, nothing posted, and the
          # check still green. It comes and goes: measured on the same pinned action, four
          # of six runs failed this way, and the two that posted ran every sub-agent in the
          # foreground. This variable turns off background tasks for the whole run,
          # "including the `run_in_background` parameter on Bash and subagent tools,
          # auto-backgrounding" (https://code.claude.com/docs/en/env-vars).
          # It goes through `settings`, not the step's `env:`. At the pinned commit the
          # action's run step lists the variables it passes, and its own env block shadows
          # the caller's (action.yml, "this step's env: block shadows ..."). Its
          # docs/configuration.md, "Custom Environment Variables", names `settings` `env`.
          # The action merges this into ~/.claude/settings.json before it installs the
          # plugin. The POSTING RULES ask for the foreground too, as a second layer.
          # The same input carries the comment guard written above, as a PreToolUse hook on Bash.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"
              },
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "Bash|Write|Edit|MultiEdit|NotebookEdit",
                    "hooks": [
                      {
                        "type": "command",
                        "timeout": 30,
                        "command": "node '${{ runner.temp }}/review-comment-guard.js' ${{ github.event.pull_request.number }} ${{ github.repository }} '${{ github.workspace }}' || exit 2"
                      }
                    ]
                  }
                ]
              }
            }
          # The action's own token is in GH_TOKEN while the review runs, so text in a PR could
          # make the review disclose it (see claude_args). The action asks for contents: write by
          # default; the review never pushes, so ask for read and a leaked token cannot push code.
          additional_permissions: |
            contents: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin reviews and then posts nothing, by design.
          # The POSTING RULES reach the plugin as arguments. Without them the model reaches for
          # `gh api` and heredoc bodies, which the allow-list denies, so nothing gets posted.
          # Measured locally on 2026-09-24 with the same CLI version: 8 denials without the
          # rules, and with them the summary goes out as an allowed `--body-file` command.
          # A redirect such as `gh pr diff <N> > file` is denied too, because its target is
          # checked as a file write: on one review elsewhere it was 22 of 23 denials. The agents
          # the plugin launches read the diff, so they get that rule too.
          # Folded (>-) into one line, which is how the plugin receives arguments.
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            POSTING RULES (follow exactly):
            get the full head commit SHA with `gh pr view ${{ github.event.pull_request.number }} --json headRefOid`, never with gh api.
            Read saved tool output with the Read tool, never with shell commands.
            Run `gh pr diff` without redirecting its output into a file, and tell every agent you launch
            to do the same and to read saved tool output with the Read tool.
            Post inline comments only with the mcp__github_inline_comment__create_inline_comment tool, never with gh api.
            To post the summary comment, first write the body to ${{ github.workspace }}/.review-summary.md with the Write tool,
            then run exactly `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file ${{ github.workspace }}/.review-summary.md`,
            with no other flags and no other file;
            never use redirects, heredocs, pipes or command substitution in gh commands,
            and never use --jq, -q, --template or -t with gh.
            Run every sub-agent in the foreground: if the Agent tool takes run_in_background, pass false, and never end your turn while a sub-agent is still running.
          # The plugin's own allowed-tools list plus an Edit rule for the summary file only (an
          # Edit rule covers the Write tool; a Write(path) rule is never matched), so its gh and
          # inline-comment calls are not denied. The denies keep the file tools off the guard
          # script, the settings that install it, and .git. `gh pr comment` is named here by this PR (by
          # number or URL) and one body file, with exact rules and no wildcard. These rules only
          # approve those forms; the plugin's own grant approves every other `gh pr comment`, so
          # the guard step above is what stops one. The reasoning for the exact rules still holds
          # for the guard, which allows the same three forms. The review action
          # puts its own token in this checkout's .git/config and in GH_TOKEN, and only inline
          # comments go through its token redaction, so a prefix rule would let injected PR text
          # post `--body-file .git/config` or `--body-file /proc/self/environ`. The Read deny keeps
          # the file tools out of .git. A trailing wildcard would not bind the file: gh takes the
          # last --body-file it is given. gh's --jq filter can read environment variables, so
          # the gh read commands may not use --jq or --template. This narrows exfiltration but
          # does not stop it: deny rules match the command text, so a crafted command can slip
          # past them, and read-only shell commands can still print the token. That token stays
          # live until the job ends, which is why it is asked for with contents: read.
          claude_args: |
            --allowedTools "Edit(/${{ github.workspace }}/.review-summary.md),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr comment ${{ github.event.pull_request.number }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} --body-file ${{ github.workspace }}/.review-summary.md),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --disallowedTools "Read(./.git/**),Edit(/${{ runner.temp }}/**),Edit(~/.claude/**),Edit(/${{ github.workspace }}/.git/**),Bash(gh * --jq*),Bash(gh * -q*),Bash(gh * --template*),Bash(gh * -t*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

