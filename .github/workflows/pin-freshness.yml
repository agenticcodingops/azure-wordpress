name: Pin freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    uses: agenticcodingops/auto-code-scanning/.github/workflows/pin-freshness.yml@ada95d3e7654300fddf55cb65cdfc11495e96984 # v3.1.3
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      # PER REPO: checkout-relative manifest path and rolling issue title.
      manifest-path: ".github/pin-freshness.json"
      issue-title: "Weekly pin freshness"
      # Always move both SHAs together; this pins the script checkout too.
      scanning-repo-ref: ada95d3e7654300fddf55cb65cdfc11495e96984 # v3.1.3
