name: Pin freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    uses: agenticcodingops/auto-code-scanning/.github/workflows/pin-freshness.yml@179f7e83fb8845aac3fc0f7c01ac0d129e4dfa00 # v3.1.2
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      # PER REPO: checkout-relative manifest path and rolling issue title.
      manifest-path: ".github/pin-freshness.json"
      issue-title: "Weekly pin freshness"
      # Always move both SHAs together; this pins the script checkout too.
      scanning-repo-ref: 179f7e83fb8845aac3fc0f7c01ac0d129e4dfa00 # v3.1.2
