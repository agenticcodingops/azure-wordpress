name: Pin freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    uses: agenticcodingops/auto-code-scanning/.github/workflows/pin-freshness.yml@ea8f45ef8fed3a460b424273fbfd5ab96402e850 # v3.1.5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      # PER REPO: checkout-relative manifest path and rolling issue title.
      manifest-path: ".github/pin-freshness.json"
      issue-title: "Weekly pin freshness"
      # Always move both SHAs together; this pins the script checkout too.
      scanning-repo-ref: ea8f45ef8fed3a460b424273fbfd5ab96402e850 # v3.1.5
