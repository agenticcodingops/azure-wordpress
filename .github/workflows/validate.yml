name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  # One Terraform version for the Format and Validate jobs. Bump it here only.
  TERRAFORM_VERSION: "1.9.8"

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Version
        run: |
          terraform version
          terraform version | grep -Fqx "Terraform v${TERRAFORM_VERSION}"

      - name: Format Check
        run: terraform fmt -recursive -check -diff

  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - modules/wordpress-site
          - modules/shared-infrastructure
          - modules/app-service
          - modules/database
          - modules/storage
          - modules/key-vault
          - modules/networking
          - modules/dns-zones
          - modules/cloudflare
          - modules/front-door
          - modules/monitoring
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Version
        run: |
          terraform version
          terraform version | grep -Fqx "Terraform v${TERRAFORM_VERSION}"

      - name: Initialize
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

  # NOTE: the standalone `tfsec` job was removed — tfsec is EOL (Aqua folded its checks
  # into Trivy) and aquasecurity's org IP-allow-list now 403s the action's binary download
  # from GitHub runners. IaC misconfiguration scanning is covered by the Terraform Security
  # Scan workflow (Trivy IaC + Checkov + tflint), which supersedes tfsec.

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.3125.0
        # Render variables to completion. Checkov's default stops the render loop once
        # 90% of edges repeat for 4 iterations, so results depended on graph size:
        # unrelated locals could leave the storage network rules unresolved and fail
        # CKV_AZURE_35/36. See the Static Analysis Constraints section of the project
        # guidance file.
        env:
          RENDER_EDGES_DUPLICATE_ITER_COUNT: "50"
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_TF_1,CKV_TF_2,CKV_AZURE_225,CKV_AZURE_13,CKV_AZURE_88,CKV_AZURE_222,CKV_AZURE_17,CKV_AZURE_94,CKV_AZURE_189,CKV_AZURE_109,CKV_AZURE_41,CKV_AZURE_211,CKV_AZURE_212,CKV_AZURE_206,CKV_AZURE_33,CKV_AZURE_59,CKV_AZURE_34,CKV2_AZURE_32,CKV2_AZURE_56,CKV2_AZURE_21,CKV2_AZURE_40,CKV2_AZURE_33,CKV2_AZURE_1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check terraform-docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: modules/wordpress-site,modules/shared-infrastructure,modules/app-service,modules/database,modules/storage,modules/key-vault,modules/networking,modules/dns-zones,modules/cloudflare,modules/front-door,modules/monitoring
          output-file: README.md
          fail-on-diff: true
