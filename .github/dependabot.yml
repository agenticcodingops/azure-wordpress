version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    # The composition module and its sub-modules must move provider majors
    # together. This tool bumps one directory at a time, so a major update
    # of a single directory can never resolve.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

