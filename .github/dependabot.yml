version: 2
updates:
  # Terraform provider updates
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(deps)"
    # The composition module and its sub-modules must move provider majors
    # together. This tool bumps one directory at a time, so a major update
    # of a single directory can never resolve.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Terraform module updates
  - package-ecosystem: "terraform"
    directory: "/modules/wordpress-site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform"
    # The composition module and its sub-modules must move provider majors
    # together. This tool bumps one directory at a time, so a major update
    # of a single directory can never resolve.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
